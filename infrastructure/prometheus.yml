global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: scm-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - identity-service:8081
          - supply-service:8082
          - commerce-service:8083
          - logistics-service:8084
          - insights-service:8085
          - notification-service:8086
          - edge-gateway:8080
