services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  identity-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: identity-service
    environment: &service-environment
      DB_URL: jdbc:postgresql://postgres:5432/identity
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_PUBLIC_KEY_LOCATION: ${JWT_PUBLIC_KEY_LOCATION}
      JWT_PRIVATE_KEY_LOCATION: ${JWT_PRIVATE_KEY_LOCATION}
      JWT_ISSUER: ${JWT_ISSUER}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      SCM_ADMIN_EMAIL: ${SCM_ADMIN_EMAIL}
      SCM_ADMIN_PASSWORD: ${SCM_ADMIN_PASSWORD}
    volumes:
      - ./infrastructure/secrets/identity/jwt-private.pem:/run/secrets/jwt-private.pem:ro
      - ./infrastructure/secrets/public/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  supply-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: supply-service
    environment:
      <<: *service-environment
      DB_URL: jdbc:postgresql://postgres:5432/supply
    volumes:
      - ./infrastructure/secrets/public/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  commerce-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: commerce-service
    environment:
      <<: *service-environment
      DB_URL: jdbc:postgresql://postgres:5432/commerce
    volumes:
      - ./infrastructure/secrets/public/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  logistics-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: logistics-service
    environment:
      <<: *service-environment
      DB_URL: jdbc:postgresql://postgres:5432/logistics
    volumes:
      - ./infrastructure/secrets/public/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  insights-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: insights-service
    environment:
      <<: *service-environment
      DB_URL: jdbc:postgresql://postgres:5432/insights
    volumes:
      - ./infrastructure/secrets/public/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: notification-service
    environment:
      <<: *service-environment
      DB_URL: jdbc:postgresql://postgres:5432/notifications
    volumes:
      - ./infrastructure/secrets/public/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  edge-gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: edge-gateway
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      IDENTITY_URL: http://identity-service:8081
      SUPPLY_URL: http://supply-service:8082
      COMMERCE_URL: http://commerce-service:8083
      LOGISTICS_URL: http://logistics-service:8084
      INSIGHTS_URL: http://insights-service:8085
      NOTIFICATIONS_URL: http://notification-service:8086
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    ports:
      - "8080:8080"
    depends_on:
      - identity-service
      - supply-service
      - commerce-service
      - logistics-service
      - insights-service
      - notification-service
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - edge-gateway
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - identity-service
      - supply-service
      - commerce-service
      - logistics-service
      - insights-service
      - notification-service

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data:
